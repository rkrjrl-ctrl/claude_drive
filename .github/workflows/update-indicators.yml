name: Update economic indicators

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch indicators
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python scripts/fetch_indicators.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "data: update indicators for $(date -u +%Y-%m-%d)"
            git push
          fi
