name: Update economic indicators

on:
  # 예약은 tick.yml이 대신 깨운다(06:00 KST, 11/4 아침 카드 때문에 8시에서 앞당김. 11/3 깃허브 예약 지연 때문에 tick 사용)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch indicators
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/fetch_indicators.py

      # 휴휴 펀드 대시보드의 빈 날 추정용 섹터·지역 ETF(별도 파일). 실패해도 위 지표 수집은 그대로 진행한다.
      - name: Fetch sector ETFs
        continue-on-error: true
        run: python scripts/fetch_sector.py

      # 휴휴 펀드 대시보드용 펀드 일별 기준가(금융투자협회 전자공시, data/fund_codes.json의 펀드만). 실패해도 진행.
      - name: Fetch fund NAV
        continue-on-error: true
        run: python scripts/fetch_fund_nav.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "data: update indicators for $(date -u +%Y-%m-%d)"
            git pull --rebase -q   # 뉴스 수집 등과 동시에 올리면 거절돼서(11/3)
            git push
          fi

      - name: Build dashboard
        run: node scripts/build_dashboard.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
